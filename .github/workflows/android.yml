name: Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore test signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          fi
      - name: Lint and build installable test APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle --no-daemon lintDebug assembleDebug
      - name: Package
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/agentscope-android-test.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: agentscope-android-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports-${{ github.run_number }}
          path: app/build/reports/
          if-no-files-found: ignore
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agentscope-android-${{ github.run_number }}
          path: dist
      - name: Publish tagged test build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$REPO" --title "$TAG" --prerelease --notes 'Android test build. Embedded official web console; native feature migration is in progress. Signing continuity requires ANDROID_DEBUG_KEYSTORE_BASE64.'
