name: Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore test signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          fi
      - name: Lint and build installable test APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Package
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/agentscope-android-test.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: agentscope-android-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports-${{ github.run_number }}
          path: app/build/reports/
          if-no-files-found: ignore
  visual-qa:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          script: |
            gradle --no-daemon connectedDebugAndroidTest
            mkdir -p ui-preview
            adb pull /sdcard/Pictures/agentscope-ui-preview/. ui-preview/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ui-preview-${{ github.run_number }}
          path: |
            ui-preview/
            app/build/reports/androidTests/
          if-no-files-found: ignore
  release:
    if: github.event_name != 'pull_request'
    needs: [build, visual-qa]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: agentscope-android-${{ github.run_number }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: native-ui-preview-${{ github.run_number }}
          path: preview
      - name: Include native screen previews
        run: cp preview/ui-preview/*.png dist/
      - name: Publish tagged test build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: native-0.3.1-build-${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: gh release create "$TAG" dist/* --repo "$REPO" --target "$COMMIT_SHA" --title "AgentScope Android $TAG" --prerelease --notes-file RELEASE_NOTES.md
