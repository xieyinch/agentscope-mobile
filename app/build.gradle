plugins { id 'com.android.application' }

android {
    namespace 'io.github.xieyinch.agentscope'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.xieyinch.agentscope'
        minSdk 26
        targetSdk 35
        versionCode (System.getenv('BUILD_NUMBER') ?: '1').toInteger()
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}
